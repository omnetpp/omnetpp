name: Build tests

on:
  push:
    branches:
      - "master"
      - "omnetpp-6.x"
  pull_request:
    branches:
      - "master"
      - "omnetpp-6.x"
  workflow_dispatch:
    # allows manual execution

jobs:
  build_tests:
    # Only run on the main repo, or when manually triggered
    if: ${{ github.repository == 'omnetpp/omnetpp' || github.event_name == 'workflow_dispatch' }}

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends \
          build-essential git make ccache clang lld bison flex perl \
          doxygen graphviz wget curl ca-certificates libdw-dev \
          libxml2-dev zlib1g-dev libwebkit2gtk-4.1-0 xdg-utils \
          qt6-base-dev qmake6 qt6-base-dev-tools \
          libqt6opengl6-dev libqt6openglwidgets6t64 \
          python3 python3-pip libpython3-dev libopenscenegraph-dev
        sudo apt install -y --no-install-recommends mpi-default-dev

    - name: Fetch ccache cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: build-tests-${{ github.base_ref || github.ref_name }}
        save: ${{ github.event_name != 'pull_request' }}
        max-size: 1G

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12.13

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: python/requirements.txt

    - name: Install Python dependencies
      run: |
        uv venv --python "${{ steps.setup-python.outputs.python-path }}" --no-python-downloads --seed .venv
        uv pip install --python .venv -r python/requirements.txt

    - name: Run build tests
      run: |
        cp configure.user.dist configure.user
        . setenv
        cd test
        make -j 4 test_build
