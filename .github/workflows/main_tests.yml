name: Main tests

on:
  push:
    branches:
      - "master"
      - "omnetpp-6.x"
  pull_request:
    branches:
      - "master"
      - "omnetpp-6.x"
  workflow_dispatch:
    # allows manual execution

jobs:
  main_tests:
    # Only run on the main repo, or when manually triggered
    if: ${{ github.repository == 'omnetpp/omnetpp' || github.event_name == 'workflow_dispatch' }}

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends \
          build-essential git make ccache clang lld bison flex perl \
          doxygen graphviz wget curl ca-certificates libdw-dev \
          libxml2-dev zlib1g-dev libwebkit2gtk-4.1-0 xdg-utils \
          qt6-base-dev qmake6 qt6-base-dev-tools \
          libqt6opengl6-dev libqt6openglwidgets6t64 \
          python3 python3-pip libpython3-dev libopenscenegraph-dev

    - name: Fetch ccache cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: main-tests-${{ github.base_ref || github.ref_name }}
        save: ${{ github.event_name != 'pull_request' }}

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12.13

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: python/requirements.txt

    - name: Install Python dependencies
      run: |
        uv venv --python "${{ steps.setup-python.outputs.python-path }}" --no-python-downloads --seed .venv
        uv pip install --python .venv -r python/requirements.txt

    - name: Configure
      run: |
        cp configure.user.dist configure.user
        . setenv
        ./configure WITH_LIBXML=yes WITH_QTENV=yes WITH_OSG=yes WITH_OSGEARTH=no

    - name: Build
      run: |
        . setenv
        make -j 4

    - name: Run tests
      run: |
        . setenv
        cd test
        for TEST in common core envir featuretool anim models makemake makemake2 \
          fingerprint sqliteresultfiles scave_results_api scave_charttemplates \
          scave_analysis scave_multi_project scave_workspace;
        do
          echo "::group::test_$TEST";
          make -j 4 test_$TEST;
          echo "::endgroup::";
        done

    # test_toolchain only makes sense in release packages for macOS or MSYS

